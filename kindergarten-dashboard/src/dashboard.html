<title>داشبورد مدیریت مهد</title>
<meta name="description" content="داشبورد مدیریتی مهدکودک: کودکان، دریافت‌ها، چک و اقساط، پرسنل، تعرفه‌ها و هزینه‌ها">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: control rail on the right (brand, date, pages, slicers) + 12-column card grid, Power BI style on deep navy */
:root{
  --bg:#0a1238; --rail:#0c1644; --panel:#121d55; --panel-2:#1a2870; --field:#0d1747;
  --line:rgba(150,170,255,.14); --grid:rgba(150,170,255,.10); --track:rgba(220,228,255,.16);
  --ink:#f3f5ff; --ink-2:#bcc5ec; --ink-3:#8b96cc;
  --c1:#e8409a; --c2:#11a3c6; --c3:#e8623f; --c4:#8a63f0; --c5:#26ad73; --neutral:#6470a8;
  --good:#3fd394; --warn:#ff9a52; --bad:#ff6178; --info:#6fb7ff;
  --tip:#070c2b; --on-accent:#ffffff;
  --f-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --f-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --r:12px;
  color-scheme:dark;
}
html[data-skin="plum"]{
  --bg:#150a2b; --rail:#1a0d36; --panel:#22123f; --panel-2:#2e1955; --field:#1a0d33;
  --line:rgba(205,160,255,.15); --grid:rgba(205,160,255,.10); --track:rgba(240,225,255,.16);
  --ink:#f8f2ff; --ink-2:#d2c2ec; --ink-3:#a08cc6; --neutral:#7a6aa0; --tip:#0d0620;
  color-scheme:dark;
}
html[data-skin="ocean"]{
  --bg:#06202b; --rail:#072631; --panel:#0b2f3d; --panel-2:#123f50; --field:#082633;
  --line:rgba(140,220,255,.15); --grid:rgba(140,220,255,.10); --track:rgba(220,245,255,.16);
  --ink:#effbff; --ink-2:#b5d7e4; --ink-3:#7fa9ba; --neutral:#5d8494; --tip:#03141b;
  color-scheme:dark;
}
html[data-skin="light"]{
  --bg:#eef1fa; --rail:#14205e; --panel:#ffffff; --panel-2:#f2f4fc; --field:#f7f8fd;
  --line:rgba(20,32,94,.12); --grid:rgba(20,32,94,.08); --track:rgba(20,32,94,.10);
  --ink:#121a45; --ink-2:#3b4677; --ink-3:#6b7499; --neutral:#9aa3c4; --tip:#121a45;
  --c1:#d6338a; --c2:#0b8fb0; --c3:#d9542f; --c4:#7650e0; --c5:#1f9a64;
  --good:#16935f; --warn:#c2631c; --bad:#cf2f48; --info:#2f6fd6;
  color-scheme:light;
}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:14px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.num,td.num{font-variant-numeric:tabular-nums}

#app{direction:rtl;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--rail);color:#f3f5ff;padding:22px 16px 28px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;border-inline-start:1px solid var(--line)}
html[data-skin="light"] .rail{--ink-2:#c8cff0;--ink-3:#97a1d0;--panel:#1d2b78;--line:rgba(255,255,255,.12)}
.brand{font-family:var(--f-display);font-size:40px;line-height:1;letter-spacing:0;color:#fff;margin:0}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--ink-3);margin-top:8px}
.today{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.today b{display:block;font-size:15px}
.today span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:var(--c1);color:var(--on-accent)}
.nav .badge{font-size:11px;min-width:22px;text-align:center;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.12)}
.nav .badge.alert{background:var(--bad);color:#fff}
.slicers{display:flex;flex-direction:column;gap:14px}
.slicer h4{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);margin:0 0 6px}
.slicer h4 button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:11px;padding:0}
.slicer h4 button:hover{color:#fff}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:6px 10px;margin-bottom:3px;border-radius:6px;background:var(--panel);border:1px solid transparent;color:var(--ink-2);cursor:pointer;text-align:right;font-size:13px}
.opt:hover{border-color:var(--line);color:#fff}
.opt[aria-pressed="true"]{background:var(--c1);color:var(--on-accent)}
.opt .n{font-size:11px;opacity:.8}

/* ---------- main ---------- */
main{min-width:0;padding-block:22px 48px;padding-inline:24px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.topbar h1{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
.topbar .actions{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-8px 0 16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.chip button{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0;font-size:13px;line-height:1}
.banner{background:color-mix(in srgb,var(--warn) 16%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.btn.primary{background:var(--c1);border-color:transparent;color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:3px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;grid-auto-flow:row dense}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;min-width:0}
.card>h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.card>h3 small{font-weight:400;font-size:11px;color:var(--ink-3)}
.card .foot{margin-top:8px;font-size:11px;color:var(--ink-3)}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s12{grid-column:1/-1}

/* KPI tiles */
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .l i{width:8px;height:8px;border-radius:2px;background:var(--k,var(--c1));display:inline-block}
.kpi .v{font-size:26px;font-weight:800;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink-3);margin-inline-start:4px}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:2px}

/* rings */
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.ring{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.ring .dial{position:relative;width:92px;height:92px}
.ring .dial b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.ring span{font-size:12px;font-weight:600;color:var(--ink)}
.ring small{font-size:11px;color:var(--ink-3)}

/* progress bars */
.bars{display:flex;flex-direction:column;gap:14px}
.pb .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:5px}
.pb .row span{color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.pb .row span i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.pb .row b{font-variant-numeric:tabular-nums}
.pbar{height:14px;border-radius:7px;background:var(--track);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:7px;background:var(--c);min-width:0}
.mini{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--track);vertical-align:middle;overflow:hidden;margin-inline-end:6px}
.mini>i{display:block;height:100%;background:var(--c1);border-radius:3px}

/* today list */
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--ink-2)}
.kv b{font-variant-numeric:tabular-nums}
.big-date{font-size:20px;font-weight:800;margin-bottom:6px}

/* charts */
.chart{position:relative;height:230px}
.chart.tall{height:270px}
.chart .center{position:absolute;inset:0 0 34px 0;display:grid;place-items:center;pointer-events:none;text-align:center}
.chart .center b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.chart .center span{font-size:11px;color:var(--ink-3)}
.chart .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px;text-align:center;padding:12px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;color:var(--ink-2);background:var(--panel-2)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent);border-color:color-mix(in srgb,var(--info) 30%,transparent)}

/* tables */
.tbl-block{margin-bottom:16px}
.tbl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.tbl-bar h3{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto;display:flex;align-items:center;gap:8px}
.tbl-bar h3 .count{font-size:12px;font-weight:500;color:var(--ink-3)}
.search{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 12px;width:220px;max-width:100%}
.tbl-scroll{overflow-x:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel);text-align:right;color:var(--ink-3);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
th .dir{font-size:10px;margin-inline-start:4px}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel-2)}
td.note{white-space:normal;min-width:180px;max-width:320px;color:var(--ink-3);font-size:12px}
td.muted,.muted{color:var(--ink-3)}
td .name{font-weight:600}
tfoot td{font-weight:700;border-bottom:0;color:var(--ink-2)}
.empty-row td{text-align:center;color:var(--ink-3);padding:24px;cursor:default}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,24,.62);display:grid;place-items:center;padding:16px;z-index:40}
.modal{direction:rtl;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(780px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .sub{color:var(--ink-3);font-size:12px;margin:0 0 16px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.field textarea{resize:vertical;min-height:70px}
.field input[readonly]{opacity:.7}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:3px;min-height:1em}
.field.err input,.field.err select{border-color:var(--bad)}
.field.err .hint{color:var(--bad)}
.date-row{display:flex;gap:6px}
.date-row input{flex:1;min-width:0}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.modal-actions .spacer{margin-inline-end:auto}
.fin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.fin div{background:var(--panel-2);border-radius:10px;padding:8px 12px}
.fin span{display:block;font-size:11px;color:var(--ink-3)}
.fin b{font-size:15px;font-variant-numeric:tabular-nums}
.related{margin-top:18px}
.related h4{font-size:13px;margin:0 0 8px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}

/* settings + welcome */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.set-grid .card p{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.skins{display:flex;flex-wrap:wrap;gap:10px}
.skin{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.skin[aria-pressed="true"]{border-color:var(--c1);box-shadow:0 0 0 1px var(--c1)}
.skin i{width:14px;height:14px;border-radius:4px;display:inline-block}
.toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.toggles label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.counts div{background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-3)}
.counts b{display:block;color:var(--ink);font-size:16px}
.welcome{max-width:560px;margin:8vh auto;text-align:center}
.drop{border:2px dashed var(--line);border-radius:14px;padding:36px 20px;margin-top:18px;background:var(--panel)}
.drop.over{border-color:var(--c1)}
.drop p{color:var(--ink-2)}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tip);color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:60;display:flex;gap:12px;align-items:center;direction:rtl;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:#ff9ccf;cursor:pointer;font-weight:700}

@media (max-width:1280px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .s3{grid-column:span 6}.s4{grid-column:span 6}.s5,.s7{grid-column:1/-1}
}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-inline-start:0;border-bottom:1px solid var(--line);padding-inline:16px}
  .nav{flex-direction:row;flex-wrap:wrap}
  .slicers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  main{padding-inline:16px}
  .grid>*{grid-column:1/-1}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .fin{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:21px}
  .toggles,.counts{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<!-- اولین بار: فایل اکسل مهد به‌صورت base64 اینجا قرار می‌گیرد (اختیاری) -->
<script id="seed-xlsx" type="text/plain"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').replace(/[‌‍‎‏\s]/g, '').replace(/ي/g, 'ی').replace(/ك/g, 'ک');
const same = (a, b) => norm(a) === norm(b);
const toEn = s => String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const faDigits = s => String(s ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
const faNum = n => Number(n || 0).toLocaleString('fa-IR');
const uniq = arr => { const seen = new Set(), out = []; for (const v of arr) { if (v == null || v === '') continue; const k = norm(v); if (!seen.has(k)) { seen.add(k); out.push(v); } } return out; };
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const pct = (a, b) => b ? Math.max(0, Math.min(1, a / b)) : 0;
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function money(n) {
  n = Number(n) || 0; const a = Math.abs(n);
  if (a >= 1e9) return faNum(+(n / 1e9).toFixed(2)) + ' میلیارد';
  if (a >= 1e6) return faNum(+(n / 1e6).toFixed(1)) + ' میلیون';
  if (a >= 1e3) return faNum(+(n / 1e3).toFixed(0)) + ' هزار';
  return faNum(n);
}
const full = n => n == null || n === '' ? '—' : faNum(n);
function parseMoney(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  const s = toEn(v).replace(/[,٬،\s]/g, '').replace(/[^\d.\-]/g, '');
  if (s === '' || s === '-') return null;
  const n = Number(s); return isFinite(n) ? n : null;
}

/* ================= Jalali calendar ================= */
const div = (a, b) => ~~(a / b), mod = (a, b) => a - ~~(a / b) * b;
const BREAKS = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
function jalCal(jy, withoutLeap) {
  let gy = jy + 621, leapJ = -14, jp = BREAKS[0], jm, jump = 0, n, i;
  for (i = 1; i < BREAKS.length; i++) { jm = BREAKS[i]; jump = jm - jp; if (jy < jm) break; leapJ += div(jump, 33) * 8 + div(mod(jump, 33), 4); jp = jm; }
  n = jy - jp; leapJ += div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
  if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;

/* ================= Excel import / export ================= */
function cleanVal(f, v) {
  if (v == null || (typeof v === 'string' && v.trim() === '')) return null;
  switch (f.type) {
    case 'money': case 'int': return parseMoney(v);
    case 'date': return dateFromExcel(v);
    case 'month': { const s = toEn(v).trim(); const m = s.match(/^(\d{4})[\/\-.](\d{1,2})/); return m ? `${m[1]}/${pad2(m[2])}` : s; }
    default: return typeof v === 'string' ? v.trim() : String(v);
  }
}
function importWorkbook(wb) {
  const out = {}, report = {};
  const index = {}; wb.SheetNames.forEach(n => { index[norm(n)] = n; });
  for (const ent of ENTS) {
    const sc = SCHEMA[ent]; out[ent] = []; report[ent] = 0;
    const name = index[norm(sc.sheet)]; if (!name) continue;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: null, blankrows: false });
    const firstH = sc.fields.find(f => f.h).h;
    const hi = rows.findIndex(r => r && r.some(c => same(c, firstH)));
    if (hi < 0) continue;
    const head = rows[hi].map(norm), col = {}, nameCol = {};
    for (const f of sc.fields) {
      if (f.h) { const i = head.indexOf(norm(f.h)); if (i >= 0) col[f.k] = i; }
      if (f.nameH) { const i = head.indexOf(norm(f.nameH)); if (i >= 0) nameCol[f.k] = i; }
    }
    for (const r of rows.slice(hi + 1)) {
      if (!r || r.every(c => c == null || String(c).trim() === '')) continue;
      const rec = {};
      for (const f of sc.fields) rec[f.k] = col[f.k] == null ? null : cleanVal(f, r[col[f.k]]);
      for (const k in nameCol) rec['_' + k + 'Name'] = r[nameCol[k]] == null ? null : String(r[nameCol[k]]).trim();
      out[ent].push(rec);
    }
    report[ent] = out[ent].length;
  }
  // resolve child/staff references written only by name
  const byName = (list, n) => list.find(x => same(x.name, n));
  for (const ent of ENTS) for (const f of SCHEMA[ent].fields) if (f.type === 'child' || f.type === 'staff') {
    const list = f.type === 'child' ? out.children : out.staff;
    for (const r of out[ent]) { const n = r['_' + f.k + 'Name']; if (!r[f.k] && n) { const hit = byName(list, n); if (hit) r[f.k] = hit.id; } delete r['_' + f.k + 'Name']; }
  }
  const prev = DB; DB = out;
  for (const ent of ENTS) for (const r of out[ent]) if (!r.id) r.id = nextId(ent);
  DB = prev;
  return { data: out, report };
}
function buildWorkbook() {
  const wb = XLSX.utils.book_new();
  for (const ent of ENTS) {
    const sc = SCHEMA[ent], head = [];
    for (const f of sc.fields) { if (f.h) head.push(f.h); if (f.nameH) head.push(f.nameH); }
    const rows = [head];
    for (const r of DB[ent]) {
      const row = [];
      for (const f of sc.fields) {
        if (f.h) row.push(r[f.k] ?? null);
        if (f.nameH) row.push(f.type === 'child' ? (childById(r[f.k])?.name ?? null) : (staffById(r[f.k])?.name ?? null));
      }
      rows.push(row);
    }
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = head.map(h => ({ wch: Math.max(10, String(h).length + 4) }));
    ws['!views'] = [{ RTL: true }];
    XLSX.utils.book_append_sheet(wb, ws, sc.sheet);
  }
  wb.Workbook = { Views: [{ RTL: true }] };
  return wb;
}
async function exportExcel() {
  if (!window.XLSX) { toast('کتابخانه‌ی اکسل بارگذاری نشد؛ اتصال اینترنت را بررسی کنید.'); return; }
  const wb = buildWorkbook();
  const filename = `mahd-backup-${TODAY.replace(/\//g, '-')}.xlsx`;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: new Uint8Array(XLSX.write(wb, { bookType: 'xlsx', type: 'array' })) }); toast('فایل اکسل پشتیبان ذخیره شد.'); }
    catch (e) { toast(e && e.code === 'declined' ? 'ذخیره‌ی فایل لغو شد.' : 'ذخیره‌ی فایل در این صفحه ممکن نشد.'); }
    return;
  }

}
function readWorkbookFile(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { try { res(XLSX.read(new Uint8Array(fr.result), { type: 'array', cellDates: true })); } catch (e) { rej(e); } };
    fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(file);
  });
}
async function importFile(file) {
  if (!window.XLSX) { toast('کتابخانه‌ی اکسل بارگذاری نشد؛ اتصال اینترنت را بررسی کنید.'); return false; }
  try {
    const wb = await readWorkbookFile(file);
    const { data, report } = importWorkbook(wb);
    if (!data.children.length) { toast('شیت «کودکان» در این فایل پیدا نشد یا خالی است.'); return false; }
    DB = data; META = { importedAt: new Date().toISOString(), source: file.name, report };
    save(); toast(`اطلاعات از «${file.name}» وارد شد: ${faNum(data.children.length)} کودک، ${faNum(data.payments.length)} دریافت.`);
    return true;
  } catch (e) { toast('این فایل خوانده نشد. یک فایل ‎.xlsx‎ با ساختار شیت‌های مهد انتخاب کنید.'); return false; }
}

}
const tariffFor = c => DB.tariffs.find(t => same(t.group, c.group) && same(t.attendance, c.attendance));
const tariffTotal = t => !t ? 0 : (t.total != null ? +t.total : (+t.cash || 0) + (+t.check1 || 0) + (+t.check2 || 0));

const isActive = c => !c.status || same(c.status, 'فعال');
let FIN = new Map();
function computeFin() {
  FIN = new Map();
  const paid = {}, done = {}, sched = {};
  for (const p of DB.payments) if (p.childId && same(p.category, 'شهریه')) paid[p.childId] = (paid[p.childId] || 0) + (+p.amount || 0);
  for (const i of DB.installments) {
    if (!i.childId) continue; const a = +i.amount || 0;
    if (isDone(i.status)) done[i.childId] = (done[i.childId] || 0) + a;
    else if (isPending(i.status)) sched[i.childId] = (sched[i.childId] || 0) + a;
  }
  for (const c of DB.children) {
    const expected = isExempt(c) ? 0 : (c.agreedFee != null ? +c.agreedFee : tariffTotal(tariffFor(c)));
    const received = (paid[c.id] || 0) + (done[c.id] || 0);
    const remaining = Math.max(0, expected - received);
    const scheduled = Math.min(sched[c.id] || 0, remaining);
    FIN.set(c.id, { expected, paid: paid[c.id] || 0, collected: done[c.id] || 0, received, remaining, scheduled, unscheduled: remaining - scheduled, ratio: expected ? pct(received, expected) : null });
  }
}

  }
  if (k === 'insurance') return n === norm('دریافت شد') ? pill('good', v, '✓') : n === norm('معاف') ? pill('', v) : pill('warn', v, '!');

    case 'staff': { const s = staffById(v); return { html: s ? `<span class="name">${esc(s.name)}</span>` : `<span class="muted">${esc(v || '—')}</span>`, sort: s ? s.name : '' }; }

    const bits = Object.values(r).map(v => norm(v));
    for (const f of SCHEMA[ent].fields) { if (f.type === 'child') bits.push(norm(childById(r[f.k])?.name)); if (f.type === 'staff') bits.push(norm(staffById(r[f.k])?.name)); }

}

  $('thead', block).innerHTML = `<tr>${cols.map(c => `<th${c.l ? ` data-sort="${c.k}"` : ''} scope="col">${esc(c.l)}${c.k === srt.k && c.l ? `<span class="dir">${srt.dir > 0 ? '▲' : '▼'}</span>` : ''}</th>`).join('')}</tr>`;

    out[f.k] = v;
  }
  if (ent === 'tariffs' && out.total == null && (out.cash != null || out.check1 != null || out.check2 != null)) out.total = (+out.cash || 0) + (+out.check1 || 0) + (+out.check2 || 0);
  for (const [k, msg] of errs) { const fe = $(`.field[data-k="${k}"]`, $('#m-form')); if (fe) { fe.classList.add('err'); $('.hint', fe).textContent = msg; } }
  return errs.length ? null : out;
}
function submitForm() {
  const out = readForm(); if (!out) { toast('چند خانه نیاز به اصلاح دارند.'); return; }
  const { ent, id } = MODAL, list = DB[ent];
  if (id) { const i = list.findIndex(r => r.id === id); if (i >= 0) list[i] = out; }
  else { if (list.some(r => r.id === out.id)) out.id = nextId(ent); list.push(out); }
  closeModal(); save(); render(); toast(`${SCHEMA[ent].one} ${id ? 'به‌روز شد' : 'ثبت شد'}.`);
}
function tryDelete(btn) {
  const { ent, id } = MODAL;
  if (ent === 'children') {
    const np = DB.payments.filter(p => p.childId === id).length, ni = DB.installments.filter(i => i.childId === id).length;
    if (np || ni) { toast(`این کودک ${faNum(np)} دریافت و ${faNum(ni)} چک/قسط دارد. به‌جای حذف، وضعیتش را «غیرفعال» یا «انصراف» کنید.`); return; }
  }
  if (ent === 'staff' && DB.salaries.some(s => s.staffId === id)) { toast('برای این نیرو حقوق ثبت شده است. به‌جای حذف، وضعیتش را «غیرفعال» کنید.'); return; }
  if (!btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = 'برای حذف دوباره بزنید'; setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = 'حذف'; } }, 4000); return; }
  const i = DB[ent].findIndex(r => r.id === id), removed = DB[ent][i];
  DB[ent].splice(i, 1); closeModal(); save(); render();
  toast(`${SCHEMA[ent].one} حذف شد.`, () => { DB[ent].splice(i, 0, removed); save(); render(); });
}
function collect(id) {
  const it = DB.installments.find(i => i.id === id); if (!it) return;
  const before = { status: it.status, doneDate: it.doneDate };
  it.status = same(it.type, 'چک') ? 'وصول‌شده' : 'پرداخت‌شده'; it.doneDate = TODAY;
  save(); render();
  toast(`${it.type || 'قسط'} ${childById(it.childId)?.name || ''} به «${it.status}» تغییر کرد.`, () => { Object.assign(it, before); save(); render(); });
}

/* ================= toast ================= */
let toastTimer = null;
function toast(msg, undo) {
  const root = $('#toast-root'); clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button type="button" data-undo>بازگردانی</button>' : ''}</div>`;
  if (undo) $('[data-undo]', root).onclick = () => { undo(); root.innerHTML = ''; };
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, undo ? 7000 : 3800);
}

/* ================= pages ================= */
const PAGES = [
  { id: 'dashboard', l: 'داشبورد' },
  { id: 'children', l: 'کودکان', ents: ['children'] },
  { id: 'payments', l: 'دریافت‌ها', ents: ['payments'] },
  { id: 'installments', l: 'چک و اقساط', ents: ['installments'] },
  { id: 'staff', l: 'پرسنل و حقوق', ents: ['staff', 'salaries'] },
  { id: 'expenses', l: 'هزینه‌ها', ents: ['expenses'] },
  { id: 'events', l: 'رویدادها', ents: ['events'] },
  { id: 'tariffs', l: 'تعرفه و خدمات', ents: ['tariffs', 'services'] },
  { id: 'settings', l: 'تنظیمات' },
];
const currentPage = () => { const h = (location.hash || '').replace('#', ''); return PAGES.some(p => p.id === h) ? h : 'dashboard'; };
function badgeFor(id) {
  if (id === 'children') return `<span class="badge">${faNum(DB.children.filter(isActive).length)}</span>`;
  if (id === 'installments') {
    const od = DB.installments.filter(i => isPending(i.status) && jdnOf(i.due) != null && jdnOf(i.due) < TODAY_JDN).length;
    return od ? `<span class="badge alert" title="سررسید گذشته">${faNum(od)}</span>` : '';
  }
  return '';
}
function renderRail() {
  const page = currentPage();
  return `<aside class="rail" aria-label="ناوبری و فیلترها">
    <div><h1 class="brand">داشبورد<small>مدیریت مهدکودک<br>سال تحصیلی ۱۴۰۵-۱۴۰۶</small></h1></div>
    <div class="today"><b>${esc(weekday(TODAY_JDN))} ${jHuman(TODAY)}</b><span>${META.savedAt ? `آخرین ذخیره: ${new Date(META.savedAt).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })}` : 'اطلاعات در همین مرورگر ذخیره می‌شود'}</span></div>
    <nav class="nav">${PAGES.map(p => `<a href="#${p.id}"${p.id === page ? ' aria-current="page"' : ''}><span>${esc(p.l)}</span>${badgeFor(p.id)}</a>`).join('')}</nav>
    <div class="slicers">${SLICERS.map(s => { const sel = PREFS.filters[s.k] || []; return `<div class="slicer"><h4><span>${esc(s.l)}</span>${sel.length ? `<button type="button" data-clear="${s.k}">پاک کردن</button>` : ''}</h4>
      ${s.opts().map(o => `<button type="button" class="opt" data-slice="${s.k}" data-v="${esc(o)}" aria-pressed="${sel.some(v => same(v, o))}"><span>${esc(o)}</span><span class="n">${faNum(DB.children.filter(c => isActive(c) && same(c[s.k], o)).length)}</span></button>`).join('')}</div>`; }).join('')}</div>
  </aside>`;
}
function renderSettings(main) {
  const counts = ENTS.map(e => `<div><b>${faNum(DB[e].length)}</b>${esc(SCHEMA[e].title)}</div>`).join('');
  const skins = [
    { id: 'navy', l: 'سرمه‌ای', sw: ['#0a1238', '#e8409a', '#11a3c6'] },
    { id: 'plum', l: 'بادمجانی', sw: ['#150a2b', '#e8409a', '#8a63f0'] },
    { id: 'ocean', l: 'شب فیروزه‌ای', sw: ['#06202b', '#11a3c6', '#e8623f'] },
    { id: 'light', l: 'روشن', sw: ['#eef1fa', '#d6338a', '#0b8fb0'] },
  ];
  const hasSeed = !!($('#seed-xlsx')?.textContent || '').trim();
  main.insertAdjacentHTML('beforeend', `<div class="set-grid">
    <section class="card"><h3>داده‌ها</h3><div class="counts">${counts}</div>
      <p>${META.importedAt ? `ورود اولیه از «${esc(META.source || 'اکسل')}» در ${new Date(META.importedAt).toLocaleString('fa-IR')}.` : ''} از این به بعد همه‌ی تغییرات را در خود داشبورد انجام دهید. برای پشتیبان‌گیری هر چند وقت یک‌بار خروجی اکسل بگیرید.</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="btn primary" type="button" data-export>دریافت خروجی اکسل</button>
        <label class="btn" for="reimport">جایگزینی با فایل اکسل جدید</label><input id="reimport" type="file" accept=".xlsx,.xls" hidden>
        ${hasSeed ? '<button class="btn danger" type="button" data-reset>بازگشت به داده‌های اولیه</button>' : ''}
      </div>
      <p class="muted" id="reimport-note" style="margin-top:10px;font-size:12px">جایگزینی با فایل جدید، همه‌ی اطلاعات فعلی داشبورد را با محتوای آن فایل عوض می‌کند.</p></section>
    <section class="card"><h3>پوسته‌ی رنگی</h3><p>رنگ پس‌زمینه و کارت‌ها را انتخاب کنید. رنگ نمودارها در همه‌ی پوسته‌ها یکسان می‌ماند تا خواندن‌شان آسان باشد.</p>
      <div class="skins">${skins.map(s => `<button type="button" class="skin" data-skin="${s.id}" aria-pressed="${(PREFS.skin || 'navy') === s.id}">${s.sw.map(c => `<i style="background:${c}"></i>`).join('')}<span>${s.l}</span></button>`).join('')}</div></section>
    <section class="card" style="grid-column:1/-1"><h3>نمودارهای داشبورد</h3><p>هر بخشی را که نمی‌خواهید در صفحه‌ی داشبورد ببینید خاموش کنید.</p>
      <div class="toggles">${WIDGETS.map(w => `<label><input type="checkbox" data-widget="${w.id}"${shown(w.id) ? ' checked' : ''}> ${esc(w.l)}</label>`).join('')}</div></section>
  </div>`);
}
function renderWelcome() {
  destroyCharts();
  $('#app').innerHTML = `<main style="grid-column:1/-1"><div class="welcome">
    <h1 class="brand" style="font-size:48px">داشبورد مهد</h1>
    <p style="color:var(--ink-2)">برای شروع، فایل اکسل اطلاعات مهد را یک بار وارد کنید. بعد از آن همه‌ی تغییرات را در خود داشبورد انجام می‌دهید و اطلاعات در همین مرورگر ذخیره می‌شود.</p>
    <label class="drop" id="drop" for="first-file"><p><b>فایل اکسل را اینجا رها کنید</b><br>یا برای انتخاب فایل کلیک کنید</p><span class="btn primary">انتخاب فایل اکسل</span></label>
    <input id="first-file" type="file" accept=".xlsx,.xls" hidden>
    <p class="muted" style="font-size:12px;margin-top:14px">شیت‌های قابل خواندن: ${ENTS.map(e => esc(SCHEMA[e].sheet)).join('، ')}</p>
    ${window.XLSX ? '' : '<p class="banner">کتابخانه‌ی خواندن اکسل بارگذاری نشد. اتصال اینترنت را بررسی کنید و صفحه را دوباره باز کنید.</p>'}
  </div></main>`;
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', async e => { const f = e.dataTransfer.files[0]; if (f && await importFile(f)) render(); });
  $('#first-file').addEventListener('change', async e => { const f = e.target.files[0]; if (f && await importFile(f)) render(); });
}
function render() {
  document.documentElement.setAttribute('data-skin', PREFS.skin || 'navy');
  if (!DB) { renderWelcome(); return; }
  computeFin(); destroyCharts();
  const page = currentPage(), meta = PAGES.find(p => p.id === page);
  const scrollY = window.scrollY;
  $('#app').innerHTML = renderRail() + '<main id="main"></main>';
  const main = $('#main');
  const fchips = SLICERS.flatMap(s => (PREFS.filters[s.k] || []).map(v => `<span class="chip">${esc(s.l)}: ${esc(v)}<button type="button" aria-label="حذف فیلتر ${esc(v)}" data-unslice="${s.k}" data-v="${esc(v)}">✕</button></span>`));
  main.insertAdjacentHTML('beforeend', `<div class="topbar"><h1>${page === 'dashboard' ? 'نمای کلی مهد' : esc(meta.l)}</h1><div class="actions">
      <button class="btn primary" type="button" data-add="payments">+ دریافت جدید</button>
      <button class="btn" type="button" data-add="installments">+ چک یا قسط</button>
      <button class="btn" type="button" data-add="children">+ کودک جدید</button></div></div>
    ${fchips.length && page !== 'settings' ? `<div class="chips">${fchips.join('')}</div>` : ''}
    ${STORAGE_OK ? '' : '<div class="banner">این مرورگر اجازه‌ی ذخیره‌سازی نمی‌دهد؛ تغییرات با بستن صفحه از بین می‌رود. از «تنظیمات ← دریافت خروجی اکسل» پشتیبان بگیرید.</div>'}`);
  if (page === 'dashboard') renderDashboard(main);
  else if (page === 'settings') renderSettings(main);
  else { main.insertAdjacentHTML('beforeend', meta.ents.map(tableBlock).join('')); meta.ents.forEach(fillTable); }
  window.scrollTo(0, scrollY);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], label, a, .modal-bg'); if (!t) return;
  const ds = t.dataset;
  if (ds.collect) { e.stopPropagation(); collect(ds.collect); return; }
  if (ds.add) { openForm(ds.add, null); return; }
  if (ds.addFor) { const [ent, cid] = ds.addFor.split(':'); openForm(ent, null, { childId: cid }); return; }
  if (ds.slice) { const sel = PREFS.filters[ds.slice] = PREFS.filters[ds.slice] || []; const i = sel.findIndex(v => same(v, ds.v)); if (i >= 0) sel.splice(i, 1); else sel.push(ds.v); savePrefs(); render(); return; }
  if (ds.unslice) { PREFS.filters[ds.unslice] = (PREFS.filters[ds.unslice] || []).filter(v => !same(v, ds.v)); savePrefs(); render(); return; }
  if (ds.clear) { PREFS.filters[ds.clear] = []; savePrefs(); render(); return; }
  if (ds.sort) { const ent = t.closest('.tbl-block').dataset.ent, cur = UI.sort[ent] || DEFAULT_SORT[ent] || {}; UI.sort[ent] = { k: ds.sort, dir: cur.k === ds.sort ? -cur.dir : 1 }; fillTable(ent); return; }
  if (ds.open) { const [ent, id] = ds.open.split(':'); openForm(ent, id); return; }
  if (ds.today) { const el = document.getElementById(ds.today); if (el) el.value = TODAY; return; }
  if (ds.close !== undefined) { closeModal(); return; }
  if (ds.closeBg !== undefined && e.target === t) { closeModal(); return; }
  if (ds.del !== undefined) { tryDelete(t); return; }
  if (ds.export !== undefined) { exportExcel(); return; }
  if (ds.skin) { PREFS.skin = ds.skin; savePrefs(); render(); return; }
  if (ds.reset !== undefined) {
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'همه‌ی تغییرات پاک می‌شود؛ دوباره بزنید'; setTimeout(() => { if (t.isConnected) { t.classList.remove('armed'); t.textContent = 'بازگشت به داده‌های اولیه'; } }, 4000); return; }
    loadSeed(true); render(); toast('داده‌های اولیه دوباره بارگذاری شد.'); return;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'm-form') { e.preventDefault(); submitForm(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('search')) { const ent = el.closest('.tbl-block').dataset.ent; UI.search[ent] = el.value; fillTable(ent); return; }
  if (MODAL && el.dataset.num === 'money') { const f = F(MODAL.ent, el.id.replace(`f-${MODAL.ent}-`, '')); updateMoneyHint(el.id, f); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.widget) { PREFS.hidden[el.dataset.widget] = !el.checked; savePrefs(); return; }
  if (MODAL && el.id === `f-${MODAL.ent}-childId`) updateChildHint(MODAL.ent);
  if (el.id === 'reimport' && el.files[0]) { if (await importFile(el.files[0])) render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && MODAL) closeModal(); });
window.addEventListener('hashchange', () => { closeModal(); window.scrollTo(0, 0); render(); });

/* ================= boot ================= */
function loadSeed(force) {
  const b64 = ($('#seed-xlsx')?.textContent || '').trim();
  if (!b64 || !window.XLSX) return false;
  try {
    const { data, report } = importWorkbook(XLSX.read(b64, { type: 'base64', cellDates: true }));
    if (!data.children.length) return false;
    DB = data; META = { importedAt: new Date().toISOString(), source: 'Mahd.xlsx', report }; save(); return true;
  } catch (e) { return false; }
}
load();
if (!DB) loadSeed(false);
render();
})();
</script>
