<title>داشبورد مدیریت مهد</title>
<meta name="description" content="داشبورد مدیریتی مهدکودک: کودکان، دریافت‌ها، چک و اقساط، پرسنل، تعرفه‌ها و هزینه‌ها">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: neon control rail on the right (brand, date, pages, slicers) + one-screen board:
   header · KPI strip · 4×3 grid of chart tiles, one tile per Excel sheet, fitted to the viewport like a Power BI page */
:root{
  --bg:#0b0418; --glow-a:rgba(150,60,255,.28); --glow-b:rgba(255,60,190,.14);
  --rail:rgba(18,6,40,.94); --panel:rgba(31,12,64,.80); --panel-solid:#1a0b36; --panel-2:#2b1354; --field:#13072a;
  --line:rgba(192,107,255,.24); --line-strong:rgba(214,140,255,.62); --grid:rgba(205,160,255,.10); --track:rgba(225,195,255,.14);
  --ink:#f7f0ff; --ink-2:#d2bdf2; --ink-3:#9f88c9;
  --c1:#c06bff; --c2:#25d6f2; --c3:#ff5ac8; --c4:#6a7dff; --c5:#36e0a0; --neutral:#7d6aa6;
  --good:#4ff0b0; --warn:#ffa25c; --bad:#ff5f7e; --info:#8bbcff;
  --tip:#12052a; --on-accent:#ffffff;
  --tile-glow:0 0 0 1px rgba(192,107,255,.10) inset,0 0 24px rgba(160,70,255,.16);
  --neon-text:0 0 4px rgba(255,255,255,.55),0 0 12px #ff5ac8,0 0 26px #c06bff;
  --f-display:'Lalezar','Vazirmatn',Tahoma,sans-serif;
  --f-body:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
  --r:14px;
  color-scheme:dark;
}
html[data-skin="navy"]{
  --bg:#060b2c; --glow-a:rgba(70,90,255,.26); --glow-b:rgba(255,60,190,.12);
  --rail:rgba(8,14,52,.94); --panel:rgba(16,26,82,.80); --panel-solid:#101a52; --panel-2:#1b2a78; --field:#0b1442;
  --line:rgba(120,150,255,.26); --line-strong:rgba(150,175,255,.6); --grid:rgba(160,180,255,.10); --track:rgba(210,220,255,.14);
  --ink:#f2f5ff; --ink-2:#c3cdf2; --ink-3:#8c98cc; --neutral:#6874a8; --tip:#060b2c;
  --tile-glow:0 0 0 1px rgba(120,150,255,.10) inset,0 0 24px rgba(80,110,255,.16);
}
html[data-skin="midnight"]{
  --bg:#050309; --glow-a:rgba(190,60,255,.16); --glow-b:rgba(37,214,242,.08);
  --rail:rgba(12,8,22,.96); --panel:rgba(20,13,36,.86); --panel-solid:#140d24; --panel-2:#22163c; --field:#0c0816;
  --line:rgba(192,107,255,.20); --line-strong:rgba(214,140,255,.55); --grid:rgba(205,160,255,.08); --track:rgba(225,195,255,.12);
  --tile-glow:0 0 0 1px rgba(192,107,255,.08) inset,0 0 30px rgba(170,70,255,.12);
}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;font-family:var(--f-body);color:var(--ink);font-size:14px;line-height:1.55;
  background:radial-gradient(1100px 620px at 88% -8%,var(--glow-a),transparent 62%),radial-gradient(900px 560px at -6% 108%,var(--glow-b),transparent 60%),var(--bg);background-attachment:fixed}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.num,td.num{font-variant-numeric:tabular-nums}
svg{display:block}

#app{direction:rtl;display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}

/* ---------- rail ---------- */
.rail{background:var(--rail);padding:20px 14px 24px;display:flex;flex-direction:column;gap:18px;height:100%;overflow-y:auto;border-inline-start:1px solid var(--line);box-shadow:-8px 0 30px rgba(120,40,220,.12)}
.brand{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1;color:#fff;margin:0;text-shadow:var(--neon-text)}
.brand small{display:block;font-family:var(--f-body);font-size:11.5px;font-weight:500;color:var(--ink-3);margin-top:10px;text-shadow:none;line-height:1.6}
.today{border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--panel)}
.today b{display:block;font-size:14px}
.today span{font-size:11.5px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;color:var(--ink-2);text-decoration:none;font-weight:500;border:1px solid transparent}
.nav a:hover{background:rgba(192,107,255,.10);color:#fff}
.nav a[aria-current="page"]{color:#fff;border-color:var(--line-strong);background:linear-gradient(90deg,rgba(255,90,200,.20),rgba(192,107,255,.32));box-shadow:0 0 14px rgba(192,107,255,.35)}
.nav .badge{font-size:11px;min-width:22px;text-align:center;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.10)}
.nav .badge.alert{background:var(--bad);color:#fff;box-shadow:0 0 10px var(--bad)}
.slicers{display:flex;flex-direction:column;gap:14px}
.slicer h4{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);margin:0 0 6px}
.slicer h4 button{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:11px;padding:0}
.slicer h4 button:hover{color:#fff}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:5px 10px;margin-bottom:3px;border-radius:7px;background:rgba(192,107,255,.07);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;text-align:right;font-size:12.5px}
.opt:hover{border-color:var(--line-strong);color:#fff}
.opt[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(90deg,#ff5ac8,#c06bff);box-shadow:0 0 12px rgba(255,90,200,.45)}
.opt .n{font-size:11px;opacity:.85}

/* ---------- main ---------- */
main{min-width:0;height:100%;overflow-y:auto;padding-block:16px 28px;padding-inline:20px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.topbar h1{margin:0;font-size:20px;font-weight:800;text-wrap:balance}
.topbar .meta{display:flex;flex-wrap:wrap;gap:6px;margin-inline-end:auto;margin-inline-start:12px}
.topbar .actions{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-6px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.chip button{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:0;font-size:13px;line-height:1}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--panel-solid));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink);padding:10px 14px;border-radius:10px;margin-bottom:12px;font-size:13px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 13px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;font-size:13px}
.btn:hover{border-color:var(--line-strong);box-shadow:0 0 12px rgba(192,107,255,.25)}
.btn.primary{background:linear-gradient(90deg,#ff5ac8,#c06bff);border-color:transparent;color:var(--on-accent);box-shadow:0 0 14px rgba(255,90,200,.35)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 0 20px rgba(255,90,200,.55)}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:2px 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-3);cursor:pointer;text-decoration:none}
.icon-btn:hover{color:#fff;border-color:var(--line);background:rgba(192,107,255,.12)}
.icon-btn svg{width:14px;height:14px}

/* ---------- one-screen board ---------- */
.dash{display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:0;box-shadow:var(--tile-glow);text-decoration:none;color:inherit}
.kpi .l{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .l i{width:7px;height:7px;border-radius:50%;background:var(--k,var(--c1));box-shadow:0 0 8px var(--k,var(--c1));flex:none}
.kpi .v{font-size:24px;font-weight:800;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 14px color-mix(in srgb,var(--k,var(--c1)) 70%,transparent);white-space:nowrap}
.kpi .v small{font-size:11.5px;font-weight:500;color:var(--ink-3);margin-inline-start:4px;text-shadow:none}
.kpi .s{font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.kpi:hover{border-color:var(--line-strong)}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;grid-auto-rows:300px}
.tile{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px;box-shadow:var(--tile-glow);container-type:inline-size}
.tile::before{content:"";position:absolute;inset:-1px -1px auto -1px;height:2px;border-radius:var(--r) var(--r) 0 0;background:linear-gradient(90deg,transparent,var(--tc,var(--c1)),transparent);opacity:.85}
.tile>header{display:flex;align-items:center;gap:6px;min-height:24px}
.tile h3{margin:0;font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto;max-width:100%}
.tile .sub{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.tile .tools{display:flex;gap:2px;margin-inline-start:auto;flex:none}
.tile .sheet{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:0 7px;white-space:nowrap;flex:none}
.tile .ilg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink-2);margin-top:2px}
.tile .ilg span{display:inline-flex;align-items:center;gap:5px}
.tile .ilg i{width:8px;height:8px;border-radius:2px;box-shadow:0 0 6px currentColor}
.tile .body{flex:1;min-height:0;position:relative;margin-top:6px;display:flex;gap:10px;align-items:stretch}
.tile .note{font-size:10.5px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{position:relative;flex:1;min-width:0;min-height:0}
.cv canvas{position:absolute;inset:0}
.cv .center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center}
.cv .center b{display:block;font-size:clamp(11px,5.2cqw,16px);font-weight:800;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 12px rgba(255,90,200,.7)}
.cv .center span{display:block;font-size:10.5px;color:var(--ink-3)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink-3);font-size:12.5px;text-align:center;padding:8px;border:1px dashed var(--line);border-radius:10px}
.empty .row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}

/* html legend beside donuts */
.lg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0;flex:0 1 46%;font-size:11.5px}
.lg li{display:grid;grid-template-columns:9px minmax(0,1fr) auto auto;align-items:center;gap:6px}
.lg i{width:9px;height:9px;border-radius:3px;box-shadow:0 0 7px var(--lc)}
.lg span{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.lg em{font-style:normal;color:var(--ink-3);font-size:10.5px;font-variant-numeric:tabular-nums;min-width:2.4em;text-align:left}
@container (max-width:330px){.tile .sheet{display:none}.lg b{display:none}.lg{flex-basis:42%}}
@container (max-width:190px){.tile .body.split{flex-direction:column}.lg{flex:none;gap:2px}}

/* rings */
.rings{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:center;text-align:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.ring .dial{position:relative;width:min(96px,100%);aspect-ratio:1;max-width:100%}
.ring .dial svg{width:100%;height:100%;overflow:visible}
.ring .dial b{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(13px,4.6cqw,19px);font-weight:800;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 10px var(--rc)}
.ring span{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.ring small{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;color:var(--ink-2);background:var(--panel-2)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent);border-color:color-mix(in srgb,var(--good) 32%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent);border-color:color-mix(in srgb,var(--bad) 38%,transparent)}
.pill.info{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent);border-color:color-mix(in srgb,var(--info) 32%,transparent)}

/* tables */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;min-width:0;box-shadow:var(--tile-glow)}
.card>h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.tbl-block{margin-bottom:16px}
.tbl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.tbl-bar h3{margin:0;font-size:15px;font-weight:700;margin-inline-end:auto;display:flex;align-items:center;gap:8px;color:var(--ink)}
.tbl-bar h3 .count{font-size:12px;font-weight:500;color:var(--ink-3)}
.search{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:6px 12px;width:220px;max-width:100%}
.tbl-scroll{overflow-x:auto;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--panel-solid);text-align:right;color:var(--ink-3);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--ink)}
th .dir{font-size:10px;margin-inline-start:4px}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:rgba(192,107,255,.08)}
td.note{white-space:normal;min-width:180px;max-width:320px;color:var(--ink-3);font-size:12px}
td.muted,.muted{color:var(--ink-3)}
td .name{font-weight:600}
tfoot td{font-weight:700;border-bottom:0;color:var(--ink-2)}
.empty-row td{text-align:center;color:var(--ink-3);padding:24px;cursor:default}
.mini{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--track);vertical-align:middle;overflow:hidden;margin-inline-end:6px}
.mini>i{display:block;height:100%;background:linear-gradient(90deg,#ff5ac8,#c06bff);border-radius:3px;box-shadow:0 0 6px #c06bff}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(6,2,16,.66);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:40}
.modal{direction:rtl;background:var(--panel-solid);color:var(--ink);border:1px solid var(--line-strong);border-radius:16px;width:min(780px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px 22px;box-shadow:0 0 40px rgba(170,70,255,.35),0 20px 60px rgba(0,0,0,.5)}
.modal.max{width:min(1180px,100%);height:min(760px,calc(100% - 32px));display:flex;flex-direction:column}
.modal.max .tile{flex:1;box-shadow:none;border:0;background:transparent;padding:0}
.modal.max .tile h3{font-size:18px}
.modal.max .lg{font-size:14px;gap:9px}
.modal.max .cv .center b{font-size:26px}
.modal.max .ring .dial{width:min(190px,100%)}
.modal.max .ring .dial b{font-size:30px}
.modal.max .ring span{font-size:15px}
.modal.max .ring small{font-size:12.5px}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .sub{color:var(--ink-3);font-size:12px;margin:0 0 16px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.field{min-width:0}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--line-strong);box-shadow:0 0 10px rgba(192,107,255,.3)}
.field textarea{resize:vertical;min-height:70px}
.field input[readonly]{opacity:.7}
.field .hint{font-size:11px;color:var(--ink-3);margin-top:3px;min-height:1em}
.field.err input,.field.err select{border-color:var(--bad)}
.field.err .hint{color:var(--bad)}
.date-row{display:flex;gap:6px}
.date-row input{flex:1;min-width:0}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.modal-actions .spacer{margin-inline-end:auto}
.fin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.fin div{background:var(--panel-2);border-radius:10px;padding:8px 12px}
.fin span{display:block;font-size:11px;color:var(--ink-3)}
.fin b{font-size:15px;font-variant-numeric:tabular-nums}
.related{margin-top:18px}
.related h4{font-size:13px;margin:0 0 8px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}

/* settings + welcome */
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.set-grid .card p{color:var(--ink-2);font-size:13px;margin:0 0 12px}
.skins{display:flex;flex-wrap:wrap;gap:10px}
.skin{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer}
.skin[aria-pressed="true"]{border-color:var(--c3);box-shadow:0 0 12px rgba(255,90,200,.45)}
.skin i{width:14px;height:14px;border-radius:4px;display:inline-block}
.toggles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 14px}
.toggles label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.counts div{background:var(--panel-2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-3)}
.counts b{display:block;color:var(--ink);font-size:16px}
.welcome{max-width:560px;margin:8vh auto;text-align:center}
.drop{display:block;border:2px dashed var(--line-strong);border-radius:16px;padding:36px 20px;margin-top:18px;background:var(--panel);cursor:pointer;box-shadow:var(--tile-glow)}
.drop.over{border-color:var(--c3);box-shadow:0 0 24px rgba(255,90,200,.4)}
.drop p{color:var(--ink-2)}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tip);color:#fff;border:1px solid var(--line-strong);padding:10px 16px;border-radius:12px;z-index:60;display:flex;gap:12px;align-items:center;direction:rtl;box-shadow:0 0 24px rgba(170,70,255,.35);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:#ff9ce0;cursor:pointer;font-weight:700}

/* presentation mode: board only, full screen */
#app.present{grid-template-columns:minmax(0,1fr)}
#app.present .rail,#app.present .topbar .actions .edit-act{display:none}

/* one-screen fit on desktop-sized windows */
@media (min-width:1100px) and (min-height:600px){
  main.fit{overflow:hidden;display:flex;flex-direction:column;padding-block:14px}
  main.fit .dash{flex:1;min-height:0}
  main.fit .board{flex:1;min-height:0;grid-template-rows:repeat(var(--rows,3),minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}
}
@media (max-width:1280px){.kpi .v{font-size:20px}}

  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}

}

  html,body{height:auto}
  #app{display:block;height:auto}

  .slicers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  main{height:auto;overflow:visible;padding-inline:16px}
  .set-grid{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:minmax(0,1fr)}

  .toggles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:620px){
  .board{grid-template-columns:minmax(0,1fr);grid-auto-rows:280px}

}

}

function dashModel() {
  const S = scope(), active = S.kids.filter(isActive);
  const tot = { expected: 0, received: 0, scheduled: 0, unscheduled: 0, remaining: 0 };
  for (const c of active) { const f = fin(c.id); for (const k in tot) tot[k] += f[k]; }
  tot.collected = tot.expected - tot.remaining;
  const todayPays = S.payments.filter(p => normDate(p.date) === TODAY);
  const staffActive = DB.staff.filter(s => !s.status || same(s.status, 'فعال'));
  const pend = S.installments.filter(i => isPending(i.status));
  const dueOf = i => jdnOf(i.due);
  const overdue = pend.filter(i => dueOf(i) != null && dueOf(i) < TODAY_JDN);
  const soon = pend.filter(i => dueOf(i) != null && dueOf(i) >= TODAY_JDN && dueOf(i) - TODAY_JDN <= 7);
  const insReqL = active.filter(c => !same(c.insurance, 'معاف') && !isExempt(c));
  const chkReqL = active.filter(c => { const s = norm(c.checkStatus); return norm(c.payMode).includes(norm('چک')) && !s.startsWith(norm('لازم')) && !s.includes(norm('نمی‌دهد')); });

  const days = []; for (let d = TODAY_JDN - 29; d <= TODAY_JDN; d++) days.push(d);
  const byDay = {}; for (const p of S.payments) { const d = jdnOf(p.date); if (d != null) byDay[d] = (byDay[d] || 0) + (+p.amount || 0); }
  const dated = pend.filter(i => dueOf(i) != null), monthOfDue = i => normDate(i.due).slice(0, 7);
  const months = uniq(dated.map(monthOfDue)).sort();
  const known = PAY_CATS.slice(0, -1);
  const catVals = PAY_CATS.map(cat => sum(S.payments.filter(p => cat === 'سایر' ? !known.some(c => same(c, p.category)) : same(p.category, cat)), p => p.amount)
    + (cat === 'شهریه' ? sum(S.installments.filter(i => isDone(i.status)), i => i.amount) : 0));
  const methods = uniq([...METHODS, ...S.payments.map(p => p.method)]);
  const methVals = methods.map(m => sum(S.payments.filter(p => same(p.method, m) || (m === 'نامشخص' && !p.method)), p => p.amount));
  const costMonths = []; { const j = d2j(TODAY_JDN); let y = j.jy, m = j.jm; for (let k = 0; k < 6; k++) { costMonths.unshift(`${y}/${pad2(m)}`); if (--m < 1) { m = 12; y--; } } }
  const salKey = s => s.month || (normDate(s.date) || '').slice(0, 7);
  const futureEvents = DB.events.filter(e => jdnOf(e.date) != null && jdnOf(e.date) >= TODAY_JDN).sort((a, b) => jdnOf(a.date) - jdnOf(b.date));
  const openEvents = DB.events.filter(e => !e.date && !same(e.status, 'برگزار شد'));
  return {
    S, active, tot, todayPays, staffActive, pend, overdue, soon,
    insReq: insReqL.length, insGot: insReqL.filter(c => same(c.insurance, 'دریافت شد')).length,
    chkReq: chkReqL.length, chkGot: chkReqL.filter(c => norm(c.checkStatus).startsWith(norm('تحویل داده'))).length,
    noPay: active.filter(c => fin(c.id).expected > 0 && fin(c.id).received === 0).length,
    atts, att: ATT.map(a => active.filter(c => same(c.attendance, a)).length),
    roles: uniq(staffActive.map(s => s.role)),
    days, dailyVals: days.map(d => byDay[d] || 0), undated: S.payments.filter(p => jdnOf(p.date) == null),
    months, dueChk: months.map(m => sum(dated.filter(i => monthOfDue(i) === m && same(i.type, 'چک')), i => i.amount)), dueCash: months.map(m => sum(dated.filter(i => monthOfDue(i) === m && !same(i.type, 'چک')), i => i.amount)),
    catVals, catTotal: sum(catVals, v => v), methods, methVals,
    classes: uniq(active.map(c => c.cls)).map(cl => ({ cl, n: active.filter(c => same(c.cls, cl)).length })).sort((a, b) => b.n - a.n),
    groups: uniq([...AGE, ...active.map(c => c.group)]).filter(g => active.some(c => same(c.group, g))),
    costMonths, salByM: costMonths.map(m => sum(DB.salaries.filter(s => salKey(s) === m), s => s.amount)), expByM: costMonths.map(m => sum(DB.expenses.filter(e => (normDate(e.date) || '').startsWith(m)), e => e.amount)),
    salThisMonth: sum(DB.salaries.filter(s => salKey(s) === TODAY.slice(0, 7)), s => s.amount),

    <section class="card"><h3>پوسته‌ی رنگی</h3><p>رنگ پس‌زمینه و کارت‌ها را انتخاب کنید. رنگ‌های نئونی نمودارها در همه‌ی پوسته‌ها یکسان می‌ماند.</p>
      <div class="skins">${SKINS.map(s => `<button type="button" class="skin" data-skin="${s.id}" aria-pressed="${(PREFS.skin || 'neon') === s.id}">${s.sw.map(c => `<i style="background:${c};box-shadow:0 0 6px ${c}"></i>`).join('')}<span>${s.l}</span></button>`).join('')}</div></section>
    <section class="card" style="grid-column:1/-1"><h3>نمودارهای صفحه‌ی داشبورد</h3><p>هر نموداری را که نمی‌خواهید در صفحه‌ی اصلی ببینید خاموش کنید؛ بقیه دوباره کل صفحه را پر می‌کنند.</p>
      <div class="toggles">${TILE_LIST.map(w => `<label><input type="checkbox" data-widget="${w.id}"${shown(w.id) ? ' checked' : ''}> ${esc(w.l)}</label>`).join('')}</div></section>
  </div>`);
}
function renderWelcome() {
  destroyCharts();
  $('#app').innerHTML = `<main style="grid-column:1/-1"><div class="welcome">
    <h1 class="brand" style="font-size:52px">داشبورد مهد</h1>
    <p style="color:var(--ink-2)">برای شروع، فایل اکسل اطلاعات مهد را یک بار وارد کنید. بعد از آن همه‌ی تغییرات را در خود داشبورد انجام می‌دهید و اطلاعات در همین مرورگر ذخیره می‌شود.</p>
    <label class="drop" id="drop" for="first-file"><p><b>فایل اکسل را اینجا رها کنید</b><br>یا برای انتخاب فایل کلیک کنید</p><span class="btn primary">انتخاب فایل اکسل</span></label>
    <input id="first-file" type="file" accept=".xlsx,.xls" hidden>
    <p class="muted" style="font-size:12px;margin-top:14px">شیت‌های قابل خواندن: ${ENTS.map(e => esc(SCHEMA[e].sheet)).join('، ')}</p>
    ${window.XLSX ? '' : '<p class="banner">کتابخانه‌ی خواندن اکسل بارگذاری نشد. اتصال اینترنت را بررسی کنید و صفحه را دوباره باز کنید.</p>'}
  </div></main>`;
  const drop = $('#drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', async e => { const f = e.dataTransfer.files[0]; if (f && await importFile(f)) render(); });
  $('#first-file').addEventListener('change', async e => { const f = e.target.files[0]; if (f && await importFile(f)) render(); });
}
function render() {
  document.documentElement.setAttribute('data-skin', PREFS.skin || 'neon');
  if (!DB) { renderWelcome(); return; }
  computeFin(); destroyCharts();
  const page = currentPage(), meta = PAGES.find(p => p.id === page);
  const prevMain = $('#main'), scrollTop = prevMain ? prevMain.scrollTop : 0, winY = window.scrollY;
  if (page !== 'dashboard') PRESENT = false;
  $('#app').innerHTML = renderRail() + '<main id="main"></main>';
  $('#app').classList.toggle('present', PRESENT);
  const main = $('#main');
  const fchips = SLICERS.flatMap(s => (PREFS.filters[s.k] || []).map(v => `<span class="chip">${esc(s.l)}: ${esc(v)}<button type="button" aria-label="حذف فیلتر ${esc(v)}" data-unslice="${s.k}" data-v="${esc(v)}">✕</button></span>`));
  const isDash = page === 'dashboard';
  let metaChips = '';
  if (isDash) {
    const ev = DB.events.filter(e => jdnOf(e.date) != null && jdnOf(e.date) >= TODAY_JDN).sort((a, b) => jdnOf(a.date) - jdnOf(b.date))[0] || DB.events.find(e => !e.date && !same(e.status, 'برگزار شد'));
    metaChips = `<div class="meta"><span class="chip">${esc(weekday(TODAY_JDN))} ${jHuman(TODAY)}</span>${ev ? `<a class="chip" href="#events" style="text-decoration:none">رویداد بعدی: ${esc(ev.title)}${ev.date ? ` · ${jHuman(ev.date, false)}` : ''}</a>` : ''}${fchips.join('')}</div>`;
  }
  main.insertAdjacentHTML('beforeend', `<div class="topbar"><h1>${isDash ? 'نمای کلی مهد' : esc(meta.l)}</h1>${metaChips}<div class="actions">
      <button class="btn primary edit-act" type="button" data-add="payments">+ دریافت جدید</button>
      <button class="btn edit-act" type="button" data-add="installments">+ چک یا قسط</button>
      <button class="btn edit-act" type="button" data-add="children">+ کودک جدید</button>
      ${isDash ? `<button class="btn" type="button" data-present>${PRESENT ? 'خروج از ارائه' : 'ارائه تمام‌صفحه'}</button>` : ''}</div></div>
    ${fchips.length && !isDash && page !== 'settings' ? `<div class="chips">${fchips.join('')}</div>` : ''}
    ${STORAGE_OK ? '' : '<div class="banner">این مرورگر اجازه‌ی ذخیره‌سازی نمی‌دهد؛ تغییرات با بستن صفحه از بین می‌رود. از «تنظیمات ← دریافت خروجی اکسل» پشتیبان بگیرید.</div>'}`);
  if (isDash) renderDashboard(main);
  else if (page === 'settings') renderSettings(main);
  else { main.insertAdjacentHTML('beforeend', meta.ents.map(tableBlock).join('')); meta.ents.forEach(fillTable); }
  main.scrollTop = scrollTop; window.scrollTo(0, winY);
}
function togglePresent() {
  PRESENT = !PRESENT;
  if (PRESENT) { try { const r = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
  else if (document.fullscreenElement) { try { const r = document.exitFullscreen(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
  render();
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-open], label, a, .modal-bg'); if (!t) return;
  const ds = t.dataset;
  if (ds.collect) { e.stopPropagation(); collect(ds.collect); return; }
  if (ds.add) { openForm(ds.add, null); return; }
  if (ds.addFor) { const [ent, cid] = ds.addFor.split(':'); openForm(ent, null, { childId: cid }); return; }
  if (ds.max) { openMax(ds.max); return; }
  if (ds.present !== undefined) { togglePresent(); return; }
  if (ds.slice) { const sel = PREFS.filters[ds.slice] = PREFS.filters[ds.slice] || []; const i = sel.findIndex(v => same(v, ds.v)); if (i >= 0) sel.splice(i, 1); else sel.push(ds.v); savePrefs(); render(); return; }
  if (ds.unslice) { PREFS.filters[ds.unslice] = (PREFS.filters[ds.unslice] || []).filter(v => !same(v, ds.v)); savePrefs(); render(); return; }
  if (ds.clear) { PREFS.filters[ds.clear] = []; savePrefs(); render(); return; }
  if (ds.sort) { const ent = t.closest('.tbl-block').dataset.ent, cur = UI.sort[ent] || DEFAULT_SORT[ent] || {}; UI.sort[ent] = { k: ds.sort, dir: cur.k === ds.sort ? -cur.dir : 1 }; fillTable(ent); return; }
  if (ds.open) { const [ent, id] = ds.open.split(':'); openForm(ent, id); return; }
  if (ds.today) { const el = document.getElementById(ds.today); if (el) el.value = TODAY; return; }
  if (ds.close !== undefined) { closeModal(); return; }
  if (ds.closeBg !== undefined && e.target === t) { closeModal(); return; }
  if (ds.del !== undefined) { tryDelete(t); return; }
  if (ds.export !== undefined) { exportExcel(); return; }
  if (ds.skin) { PREFS.skin = ds.skin; savePrefs(); render(); return; }
  if (ds.reset !== undefined) {
    if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'همه‌ی تغییرات پاک می‌شود؛ دوباره بزنید'; setTimeout(() => { if (t.isConnected) { t.classList.remove('armed'); t.textContent = 'بازگشت به داده‌های اولیه'; } }, 4000); return; }
    loadSeed(true); render(); toast('داده‌های اولیه دوباره بارگذاری شد.'); return;
  }
  if (t.tagName === 'A' && t.getAttribute('href') === location.hash && $('#modal-root').innerHTML) closeModal();
});
document.addEventListener('submit', e => { if (e.target.id === 'm-form') { e.preventDefault(); submitForm(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('search')) { const ent = el.closest('.tbl-block').dataset.ent; UI.search[ent] = el.value; fillTable(ent); return; }
  if (MODAL && el.dataset.num === 'money') { const f = F(MODAL.ent, el.id.replace(`f-${MODAL.ent}-`, '')); updateMoneyHint(el.id, f); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.widget) { PREFS.hidden[el.dataset.widget] = !el.checked; savePrefs(); return; }
  if (MODAL && el.id === `f-${MODAL.ent}-childId`) updateChildHint(MODAL.ent);
  if (el.id === 'reimport' && el.files[0]) { if (await importFile(el.files[0])) render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && PRESENT) { PRESENT = false; render(); } });
window.addEventListener('hashchange', () => { closeModal(); window.scrollTo(0, 0); const m = $('#main'); if (m) m.scrollTop = 0; render(); });

/* ================= boot ================= */
function loadSeed(force) {
  const b64 = ($('#seed-xlsx')?.textContent || '').trim();
  if (!b64 || !window.XLSX) return false;
  try {
    const { data, report } = importWorkbook(XLSX.read(b64, { type: 'base64', cellDates: true }));
    if (!data.children.length) return false;
    DB = data; META = { importedAt: new Date().toISOString(), source: 'Mahd.xlsx', report }; save(); return true;
  } catch (e) { return false; }
}
load();
if (!DB) loadSeed(false);
render();
// redraw once the Persian web font is ready so chart text is measured with it
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (DB && !$('#modal-root').innerHTML) render(); });
})();
</script>
